# juan-terminal settings (edit and save; ⌘, opens this file in the app).
#
# blocked_websites: blocked system-wide through a managed block in /etc/hosts (macOS asks for
#   your password when the list changes). Domains only; "www." is added automatically. No
#   wildcards: list each subdomain you need. Browsers with their own "Secure DNS" (DoH) ignore
#   /etc/hosts: turn it off there. Adding a site blocks it right away; a removed site stays
#   blocked for 24 hours first (no impulse unblocking).
#
# [projects.<id>] schedule: hours the project can be opened in juan-terminal (<id> is the
#   project's id in state.toml, usually its folder name). Outside them the project is locked in
#   the sidebar and closed if it is open. Folders on disk are never moved or hidden.
#   start > end crosses midnight ("days" = day the window starts); start == end = all day;
#   no "days" = every day. Times are the Mac's local time unless the project sets utc_offset
#   (fixed offset, e.g. "-05:00" for Colombia, which has no daylight saving). Example:
#
#   [projects.my-project]
#   utc_offset = "-05:00"
#   schedule = [
#     { days = ["mon", "tue", "wed", "thu", "fri"], start = "09:00", end = "18:00" },
#   ]

