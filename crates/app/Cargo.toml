[package]
name = "juan-terminal"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "juan-terminal"
path = "src/main.rs"

[dependencies]
gpui.workspace = true
anyhow.workspace = true
libc.workspace = true
core-foundation = "=0.10.0"
futures.workspace = true
editor = { path = "../editor" }
project_search = { path = "../project_search" }
git_engine = { path = "../git_engine" }
code_quality = { path = "../code_quality" }
lsp_client = { path = "../lsp_client" }
claude_ide = { path = "../claude_ide" }
ssh_remote = { path = "../ssh_remote" }
serde.workspace = true
serde_json = "=1.0.154"
base64 = "=0.22.1"
imagesize = "=0.13.0"
objc = "=0.2.7"
raw-window-handle = "=0.6.2"
terminal_engine = { path = "../terminal_engine" }
workspace_state = { path = "../workspace_state" }
sha1_smol = "=1.0.1"
sha2 = "=0.10.9"
rqrr = { version = "=0.11.0", default-features = false }
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg"] }
zip = { version = "=9.8.2", default-features = false, features = ["deflate"] }
calamine = { version = "=0.38.0", features = ["dates"] }
pulldown-cmark = { version = "=0.13.0", default-features = false, features = ["html"] }
