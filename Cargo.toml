[workspace]
resolver = "2"
exclude = ["vendor/gpui"]
members = ["crates/app", "crates/workspace_state", "crates/terminal_engine", "crates/editor", "crates/project_search", "crates/git_engine", "crates/code_quality", "crates/lsp_client", "crates/claude_ide", "crates/ssh_remote", "crates/whatsapp"]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT"

[workspace.dependencies]
gpui = { version = "=0.2.2", features = ["runtime_shaders"] }
alacritty_terminal = "=0.26.0"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
anyhow = "1"
log = "0.4"
futures = "0.3"
libc = "0.2"
ropey = "=1.6.1"
tree-sitter = "=0.27.2"
tree-sitter-highlight = "=0.27.2"
tree-sitter-javascript = "=0.25.0"
tree-sitter-typescript = "=0.23.2"
tree-sitter-rust = "=0.24.2"
tree-sitter-json = "=0.24.8"
tree-sitter-toml-ng = "=0.7.0"
tree-sitter-yaml = "=0.7.2"
tree-sitter-md = "=0.5.4"
tree-sitter-bash = "=0.25.1"
tree-sitter-css = "=0.25.0"
tree-sitter-html = "=0.23.2"
tree-sitter-vue-next = "=0.1.0"

[profile.release]
lto = "thin"
codegen-units = 1
debug = false
strip = true
opt-level = 3

# Local installs (packaging/build-app.sh): optimized but without LTO and with parallel,
# incremental codegen, so rebuilding after a change takes a fraction of `release`.
[profile.fastrelease]
inherits = "release"
lto = false
codegen-units = 256
incremental = true

[profile.dev]
debug = 1

# Local gpui fork: fixes a main-thread deadlock in window_did_change_key_status
# (resignKeyWindow called while holding window_state lock). See vendor/gpui.
[patch.crates-io]
gpui = { path = "vendor/gpui" }
